services:
  app:
    image: mcr.microsoft.com/devcontainers/java:3-21-trixie
    volumes:
      - ..:/workspace/Seafood-Restaurant:cached
    working_dir: /workspace/Seafood-Restaurant
    command: sleep infinity
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seafood_restaurant
    volumes:
      - mysql-data:/var/lib/mysql
      - ../SeaFoodRestaurant(BE)/Script.sql:/docker-entrypoint-initdb.d/01-script.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data: